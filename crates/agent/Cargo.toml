[package]
name = "wordcraft-agent"
description = "وكيل, the AI agent inside كلمة: Claude, Gemini, OpenRouter and free models, streaming, and the agent loop (no interface code)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.23"
# The same HTTPS stack (and system certificate store) as the app's updater, so nothing is built twice.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }

# API keys in the Keychain; already in the build through the system certificate check.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
